[properties]
# The x86_64 Linux development host runs these 32-bit test executables directly.
needs_exe_wrapper = false

[built-in options]
# Behavior tests do not need the production artifact's glibc 2.3 compatibility.
c_args = ['--target=x86-linux-gnu']
c_link_args = ['--target=x86-linux-gnu']
# Preserve the host Boost fallback because this cross file replaces cpp_args.
cpp_args = ['--target=x86-linux-gnu', '-stdlib=libc++', '-idirafter', '/usr/include']
cpp_link_args = ['--target=x86-linux-gnu', '-stdlib=libc++']
