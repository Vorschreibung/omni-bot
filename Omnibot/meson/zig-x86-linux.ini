[binaries]
c = ['zig', 'cc']
cpp = ['zig', 'c++']
ar = ['zig', 'ar']
strip = ['zig', 'strip']

[properties]
# Production modules target legacy Linux and cannot run on the build host.
needs_exe_wrapper = true

[built-in options]
c_args = ['--target=x86-linux-gnu.2.3']
c_link_args = ['--target=x86-linux-gnu.2.3']
# Existing header-only Boost uses fall back to the host after Zig's target headers.
cpp_args = ['--target=x86-linux-gnu.2.3', '-stdlib=libc++', '-idirafter', '/usr/include']
cpp_link_args = ['--target=x86-linux-gnu.2.3', '-stdlib=libc++']

[host_machine]
system = 'linux'
cpu_family = 'x86'
cpu = 'x86'
endian = 'little'
