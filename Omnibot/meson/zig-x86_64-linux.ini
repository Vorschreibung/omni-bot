[binaries]
c = ['zig', 'cc']
cpp = ['zig', 'c++']
ar = ['zig', 'ar']
strip = ['zig', 'strip']

[properties]
# Cross-compiled modules cannot run during configuration.
needs_exe_wrapper = true

[built-in options]
c_args = ['--target=x86_64-linux-gnu.2.17']
c_link_args = ['--target=x86_64-linux-gnu.2.17']
cpp_args = ['--target=x86_64-linux-gnu.2.17', '-stdlib=libc++']
cpp_link_args = ['--target=x86_64-linux-gnu.2.17', '-stdlib=libc++']

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
