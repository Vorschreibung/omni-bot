[workspace]
authors = ["Vorschreibung <vorschreibung@gmail.com>"]
channels = ["conda-forge"]
name = "omni-bot"
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]
version = "0.1.0"

[tasks]
dev = { cmd = ["python", "./dev.py"] }

[dependencies]
# Wildcard constraints keep explicit updates on the latest available toolchain.
cmake = "*"
ninja = "*"
python = "*"
zig = "*"

[target.osx-64.dependencies]
# Zig 0.16.0 cannot create static archives on Intel macOS hosts.
zig = "0.15.2.*"

[target.win-64.dependencies]
# Zig 0.16.0 panics during cold Linux C++ cross-links on Windows hosts.
zig = "0.15.2.*"
